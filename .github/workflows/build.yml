name: Build

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  build-arm:
    name: Build ARM (Kindle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Build static ARM binary
        run: make -f Makefile.static

      - name: Verify binary
        run: |
          file kindle-apple2-static | grep -q "ARM"
          ls -la kindle-apple2-static

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kindle-apple2-arm
          path: kindle-apple2-static
